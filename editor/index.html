<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio · Jordan Joe Cooper</title>
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">J</span><div><strong>Studio</strong><small>jordanjoecooper.com</small></div></div>
        <button id="new-post" class="new-button">＋ New post <kbd>⌘ N</kbd></button>
        <div class="sidebar-label"><span>Writing</span><span id="post-count"></span></div>
        <nav id="post-list" class="post-list"></nav>
        <div class="sidebar-foot">Local only · saved to this repository</div>
      </aside>
      <main class="workspace">
        <header class="topbar"><div id="save-state" class="save-state">Select a post</div><div class="top-actions"><button id="preview-toggle" class="quiet-button">Preview</button><button id="save-post" class="save-button" disabled>Save <kbd>⌘ S</kbd></button></div></header>
        <section id="empty-state" class="empty-state"><div class="empty-icon">✦</div><h1>A quieter place to write.</h1><p>Choose a post or start something new.</p><button id="empty-new" class="new-button">Write a new post</button></section>
        <section id="editor-view" class="editor-view hidden">
          <div class="editor-scroll"><div class="metadata"><input id="title" class="title-input" placeholder="Untitled post" /><input id="description" class="description-input" placeholder="A short description for search and sharing" /><div class="meta-row"><label>Published <input id="pubDate" type="date" /></label><label class="check"><input id="draft" type="checkbox" /> Draft</label><label class="check"><input id="pinned" type="checkbox" /> Pin to home</label></div></div><textarea id="body" spellcheck="true" placeholder="Begin writing…"></textarea><div class="editor-footer"><span id="word-count">0 words</span><span>Markdown supported · drop an image to insert it</span></div></div>
          <article id="preview" class="preview prose"></article>
        </section>
      </main>
    </div>
    <script src="/editor.js"></script>
  </body>
</html>
